[versions]
# Must match the Kotlin version revanced-patcher is built with (see
# ../revanced-patcher/gradle/libs.versions.toml): this plugin supplies the Kotlin
# compiler used for the ReVanced patch sources, and an older compiler cannot read
# metadata produced by a newer one.
kotlin = "2.3.10"
agp = "9.1.0"
guava = "33.5.0-jre"

[libraries]
kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
android-application = { module = "com.android.application:com.android.application.gradle.plugin", version.ref = "agp" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin"}
