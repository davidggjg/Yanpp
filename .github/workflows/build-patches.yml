name: Build patch bundles

# Molt ships two patch bundles because it carries two patching engines.
# The file extension is the engine marker:
#   .mpp -> Morphe-lineage engine (app.morphe.patcher)
#   .rvp -> ReVanced-lineage engine (app.revanced.patcher), the wide app coverage
# Both are built here so a release can publish them together.

on:
  push:
    paths:
      - 'revanced-patches/**'
      - 'revanced-patcher/**'
      - 'revanced-patches-gradle-plugin/**'
      - 'morphe-patches/**'
      - 'morphe-patcher/**'
      - 'morphe-patches-library/**'
      - 'morphe-patches-gradle-plugin/**'
      - '.github/workflows/build-patches.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-patches-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Needed to read app.revanced:apktool-lib from GitHub Packages.
  packages: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    strategy:
      # Keep going so one lineage failing still tells us about the other.
      fail-fast: false
      matrix:
        include:
          - name: revanced
            dir: revanced-patches
            ext: rvp
          - name: morphe
            dir: morphe-patches
            ext: mpp

    name: ${{ matrix.name }} bundle

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # These projects were on Gradle 9.3.1 before being aligned to 9.6.1, and the
          # restored Gradle home cache kept handing back type-safe project accessors
          # compiled against the old version, which blew up as
          #   AbstractMethodError: RootProjectAccessor_Decorated does not define
          #   ExtensionAware.getExtensions()
          # Building without the shared cache keeps generated code and the running
          # Gradle version from ever drifting apart.
          cache-disabled: true

      - name: Build ${{ matrix.name }} bundle
        working-directory: ${{ matrix.dir }}
        env:
          _JAVA_OPTIONS: "-Djava.awt.headless=true"
          # app.revanced:apktool-lib only exists on GitHub Packages, and those Maven
          # registries need a token even to read public packages. The workflow token is
          # enough for that, so pass it through.
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew build -PskipSigning --stacktrace

      - name: Show what was produced
        if: always()
        run: find ${{ matrix.dir }} -name '*.${{ matrix.ext }}' | head -20

      - name: Upload ${{ matrix.name }} bundle
        uses: actions/upload-artifact@v4
        with:
          name: molt-${{ matrix.name }}-patches
          path: ${{ matrix.dir }}/**/build/libs/*.${{ matrix.ext }}
          if-no-files-found: error
